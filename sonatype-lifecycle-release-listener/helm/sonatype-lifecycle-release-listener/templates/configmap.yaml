{{- if .Values.config.caCerts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sonatype-lifecycle-release-listener.fullname" . }}-certs
  labels:
    {{- include "sonatype-lifecycle-release-listener.labels" . | nindent 4 }}
data:
  ca_bundle.pem: |
    {{- .Values.config.caCerts | nindent 4 }}
{{- end }}
