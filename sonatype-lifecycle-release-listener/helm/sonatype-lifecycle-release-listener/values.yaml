# Default values for sonatype-lifecycle-release-listener
# This is a YAML-formatted file.

# Number of replicas
replicaCount: 1

image:
  repository: sonatype-lifecycle-release-listener
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sonatype-lifecycle-release-listener.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sonatype-lifecycle-release-listener-tls
  #    hosts:
  #      - sonatype-lifecycle-release-listener.local

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Application configuration
config:
  # SonaType CA certificates (base64 encoded)
  # Set this to the contents of your CA bundle
  caCerts: ""
  # Path where CA certs will be mounted (used for SonaType and FalkorDB when set)
  caCertsPath: /app/certs/ca_bundle.pem
  # Comma-separated field:prefix pairs for labeling internal projects
  # e.g. "group:com.acme,name:acme-"
  internalPrefixes: ""

# SonaType Lifecycle API
sonatype:
  # Optional API base URL (e.g. https://nexus.example.com); leave empty for default
  host: ""

# Secrets configuration
# These should be provided via --set or a secrets management solution
secrets:
  # SonaType credentials
  sonatypeUsername: ""
  sonatypePassword: ""
  # If using existing secret, specify the name
  existingSecret: ""
  # Keys in the existing secret
  existingSecretUsernameKey: "sonatype-username"
  existingSecretPasswordKey: "sonatype-password"
  # Key for FalkorDB password in existing secret (leave empty to use falkordb.password)
  existingSecretFalkordbPasswordKey: ""

# FalkorDB connection
falkordb:
  # Host for FalkorDB connection
  host: "falkordb"
  # Port for FalkorDB connection
  port: 6379
  # Graph name to use for persistence
  graphName: "acme-corp"
  # Optional password for FalkorDB; or use secrets.existingSecretFalkordbPasswordKey
  password: ""
  # Optional CA cert path for FalkorDB TLS; defaults to config.caCertsPath when config.caCerts set
  caCertsPath: ""

# Extra environment variables
extraEnv: []
  # - name: EXAMPLE_VAR
  #   value: "example-value"

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []
