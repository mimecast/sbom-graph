[loggers]
keys=root,sonatype_lifecycle_release_listener,sbom_graph_model

[handlers]
keys=consoleHandler,debugHandler,infoHandler,errorHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,infoHandler,errorHandler,debugHandler

[logger_sonatype_lifecycle_release_listener]
level=DEBUG
handlers=consoleHandler,debugHandler,infoHandler,errorHandler
qualname=sonatype_lifecycle_release_listener
propagate=0

[logger_sbom_graph_model]
level=DEBUG
handlers=consoleHandler,debugHandler,infoHandler,errorHandler
qualname=sbom_graph_model
propagate=0

[handler_debugHandler]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('debug.log','a')

[handler_infoHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('info.log','a')

[handler_errorHandler]
class=FileHandler
level=ERROR
formatter=simpleFormatter
args=('error.log','a')

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(funcName)s - %(levelname)s - %(message)s
