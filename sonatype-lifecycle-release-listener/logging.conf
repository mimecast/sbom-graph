[loggers]
keys=root,sonatype_lifecycle_release_listener,sbom_graph_model

[handlers]
keys=consoleHandler,errorHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler,errorHandler

[logger_sonatype_lifecycle_release_listener]
level=INFO
handlers=consoleHandler,errorHandler
qualname=sonatype_lifecycle_release_listener
propagate=0

[logger_sbom_graph_model]
level=WARNING
handlers=errorHandler
qualname=sbom_graph_model
propagate=0

# Container-appropriate logging: stream to stdout/stderr only. File handlers were
# removed — they wrote to the CWD, which fails under readOnlyRootFilesystem and
# silently degraded logging to a DEBUG fallback (CWE-532).
[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_errorHandler]
class=StreamHandler
level=ERROR
formatter=simpleFormatter
args=(sys.stderr,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(funcName)s - %(levelname)s - %(message)s
