# Default values for sbom-graph-api
# This is a YAML-formatted file.

replicaCount: 2

image:
  repository: sbom-graph-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sbom-graph-api.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: sbom-graph-api-tls
  #    hosts:
  #      - sbom-graph-api.local

# Resource requirements for graph visualizations with FalkorDB
#
# Memory sizing guide (for 1GB FalkorDB):
# - Each gunicorn worker needs ~300MB for heavy visualization workloads
# - Base formula: (workers × 300MB) + 200MB overhead
# - Default (4 workers): (4 × 300) + 200 = 1.4GB minimum, 2Gi recommended
#
# Scaling guidelines:
# - Small (1-2 workers, light use): 512Mi-1Gi
# - Medium (4 workers, normal use): 2Gi (default)
# - Large (6+ workers, heavy use): 3Gi+
#
# For FalkorDB sizes larger than 1GB, increase proportionally
resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # Flask configuration
  flask:
    debug: "false"
    host: "0.0.0.0"
    port: "8080"
  
  # FalkorDB configuration
  falkordb:
    host: "falkordb"
    port: "6379"
    graphName: "acme_corp"
    # Label used for internal nodes (used by internal_only filter)
    internalLabel: "INTERNAL"
    # Connection timeouts (in seconds)
    socketTimeout: "30.0"
    connectTimeout: "10.0"
    # Password is loaded from secret if existingSecret is set
    existingSecret: ""
    secretKey: "password"
  
  # TLS configuration
  tls:
    enabled: false
    # TLS certificates can be provided via existing secret
    existingSecret: ""
    certKey: "tls.crt"
    keyKey: "tls.key"
    caKey: "ca.crt"
  
  # Authentication configuration
  auth:
    enabled: false
    # JWT configuration
    jwt:
      accessTokenExpiresHours: "1"
      refreshTokenExpiresDays: "30"
      # Secret key loaded from secret
      existingSecret: ""
      secretKey: "jwt-secret"
    # LDAP configuration
    ldap:
      enabled: false
      server: ""
      port: "389"
      useSsl: "false"
      baseDn: ""
      userDnTemplate: "uid={username},ou=users,dc=example,dc=com"
      searchFilter: "(uid={username})"
      # Group-based authorization
      groupSearchBase: ""           # Base DN for group searches (e.g., "ou=groups,dc=example,dc=com")
      adminGroups: ""               # Comma-separated list of groups that grant admin access
      userGroups: ""                # Comma-separated list of groups that grant regular user access
      allowedGroups: ""             # Legacy: combined allowed groups (use adminGroups/userGroups instead)
      requiredGroup: ""             # Legacy: single required group (deprecated)
      requireGroupMembership: false # Set to true to enforce group membership checks
      # Bind credentials loaded from secret
      existingSecret: ""
      bindDnKey: "bind-dn"
      bindPasswordKey: "bind-password"
  
  # Token storage configuration
  tokenStorage:
    # Encryption key loaded from secret
    existingSecret: ""
    encryptionKeyKey: "encryption-key"

# Secrets to be created (if not using existingSecret)
# These values should be provided via --set or a separate values file
secrets:
  # Set to true to create the secrets from values below
  create: false
  # Flask secret key (for sessions)
  flaskSecretKey: ""
  # JWT secret key
  jwtSecretKey: ""
  # Token database encryption key
  tokenDbEncryptionKey: ""
  # FalkorDB password
  falkordbPassword: ""
  # LDAP bind credentials
  ldapBindDn: ""
  ldapBindPassword: ""

# Persistent volume for token storage
persistence:
  enabled: false
  # Use existing PVC
  existingClaim: ""
  # Storage class (leave empty for default)
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  # Mount path in container
  mountPath: /data

# Gunicorn configuration
#
# Worker calculation for available memory:
#   workers = (container_memory_limit - 200MB) / 300MB
#
# Examples:
#   512Mi limit  → 1 worker   (tight, development only)
#   1Gi limit    → 2 workers  (light production)
#   2Gi limit    → 4 workers  (recommended for 1GB FalkorDB)
#   3Gi limit    → 6 workers  (heavy use)
#
# Each worker uses ~300MB under heavy visualization load
# Threads multiply concurrency without proportional memory increase
gunicorn:
  workers: 4
  threads: 2
  workerClass: gthread  # Better handling of concurrent requests
  timeout: 300  # 5 minutes for deep graph queries
  gracefulTimeout: 30  # Allow workers 30s to finish on shutdown
  keepAlive: 5  # Keep connections alive (matches typical LB settings)
  # Recycle workers periodically to prevent memory leaks
  maxRequests: 1000
  maxRequestsJitter: 50

# Probes configuration
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
