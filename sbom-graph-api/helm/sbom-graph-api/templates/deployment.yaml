apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbom-graph-api.fullname" . }}
  labels:
    {{- include "sbom-graph-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sbom-graph-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sbom-graph-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sbom-graph-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--bind"
            - "0.0.0.0:{{ .Values.config.flask.port }}"
            - "--workers"
            - "{{ .Values.gunicorn.workers }}"
            - "--threads"
            - "{{ .Values.gunicorn.threads }}"
            {{- if .Values.gunicorn.workerClass }}
            - "--worker-class"
            - "{{ .Values.gunicorn.workerClass }}"
            {{- end }}
            - "--timeout"
            - "{{ .Values.gunicorn.timeout }}"
            {{- if .Values.gunicorn.gracefulTimeout }}
            - "--graceful-timeout"
            - "{{ .Values.gunicorn.gracefulTimeout }}"
            {{- end }}
            {{- if .Values.gunicorn.keepAlive }}
            - "--keep-alive"
            - "{{ .Values.gunicorn.keepAlive }}"
            {{- end }}
            {{- if .Values.gunicorn.maxRequests }}
            - "--max-requests"
            - "{{ .Values.gunicorn.maxRequests }}"
            {{- end }}
            {{- if .Values.gunicorn.maxRequestsJitter }}
            - "--max-requests-jitter"
            - "{{ .Values.gunicorn.maxRequestsJitter }}"
            {{- end }}
            - "sbom_graph_api.wsgi:app"
          ports:
            - name: http
              containerPort: {{ .Values.config.flask.port }}
              protocol: TCP
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # Flask configuration
            - name: FLASK_DEBUG
              value: {{ .Values.config.flask.debug | quote }}
            - name: FLASK_HOST
              value: {{ .Values.config.flask.host | quote }}
            - name: FLASK_PORT
              value: {{ .Values.config.flask.port | quote }}
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbom-graph-api.fullname" . }}-secret
                  key: flask-secret-key
            # FalkorDB configuration
            - name: FALKORDB_HOST
              value: {{ .Values.config.falkordb.host | quote }}
            - name: FALKORDB_PORT
              value: {{ .Values.config.falkordb.port | quote }}
            - name: FALKORDB_GRAPH_NAME
              value: {{ .Values.config.falkordb.graphName | quote }}
            - name: FALKORDB_INTERNAL_LABEL
              value: {{ .Values.config.falkordb.internalLabel | quote }}
            - name: FALKORDB_SOCKET_TIMEOUT
              value: {{ .Values.config.falkordb.socketTimeout | quote }}
            - name: FALKORDB_CONNECT_TIMEOUT
              value: {{ .Values.config.falkordb.connectTimeout | quote }}
            {{- if .Values.config.falkordb.existingSecret }}
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.falkordb.existingSecret }}
                  key: {{ .Values.config.falkordb.secretKey }}
            {{- end }}
            # TLS configuration
            - name: TLS_ENABLED
              value: {{ .Values.config.tls.enabled | quote }}
            {{- if .Values.config.tls.enabled }}
            - name: TLS_CERT_FILE
              value: "/certs/tls.crt"
            - name: TLS_KEY_FILE
              value: "/certs/tls.key"
            {{- if .Values.config.tls.caKey }}
            - name: TLS_CA_FILE
              value: "/certs/ca.crt"
            {{- end }}
            {{- end }}
            # Authentication configuration
            - name: AUTH_ENABLED
              value: {{ .Values.config.auth.enabled | quote }}
            {{- if .Values.config.auth.enabled }}
            - name: JWT_ACCESS_TOKEN_EXPIRES_HOURS
              value: {{ .Values.config.auth.jwt.accessTokenExpiresHours | quote }}
            - name: JWT_REFRESH_TOKEN_EXPIRES_DAYS
              value: {{ .Values.config.auth.jwt.refreshTokenExpiresDays | quote }}
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.auth.jwt.existingSecret | default (printf "%s-secret" (include "sbom-graph-api.fullname" .)) }}
                  key: {{ .Values.config.auth.jwt.secretKey | default "jwt-secret" }}
            # LDAP configuration
            - name: LDAP_ENABLED
              value: {{ .Values.config.auth.ldap.enabled | quote }}
            {{- if .Values.config.auth.ldap.enabled }}
            - name: LDAP_SERVER
              value: {{ .Values.config.auth.ldap.server | quote }}
            - name: LDAP_PORT
              value: {{ .Values.config.auth.ldap.port | quote }}
            - name: LDAP_USE_SSL
              value: {{ .Values.config.auth.ldap.useSsl | quote }}
            - name: LDAP_BASE_DN
              value: {{ .Values.config.auth.ldap.baseDn | quote }}
            - name: LDAP_USER_DN_TEMPLATE
              value: {{ .Values.config.auth.ldap.userDnTemplate | quote }}
            - name: LDAP_SEARCH_FILTER
              value: {{ .Values.config.auth.ldap.searchFilter | quote }}
            {{- if .Values.config.auth.ldap.groupSearchBase }}
            - name: LDAP_GROUP_SEARCH_BASE
              value: {{ .Values.config.auth.ldap.groupSearchBase | quote }}
            {{- end }}
            {{- if .Values.config.auth.ldap.adminGroups }}
            - name: LDAP_ADMIN_GROUPS
              value: {{ .Values.config.auth.ldap.adminGroups | quote }}
            {{- end }}
            {{- if .Values.config.auth.ldap.userGroups }}
            - name: LDAP_USER_GROUPS
              value: {{ .Values.config.auth.ldap.userGroups | quote }}
            {{- end }}
            {{- if .Values.config.auth.ldap.allowedGroups }}
            - name: LDAP_ALLOWED_GROUPS
              value: {{ .Values.config.auth.ldap.allowedGroups | quote }}
            {{- end }}
            {{- if .Values.config.auth.ldap.requiredGroup }}
            - name: LDAP_REQUIRED_GROUP
              value: {{ .Values.config.auth.ldap.requiredGroup | quote }}
            {{- end }}
            - name: LDAP_REQUIRE_GROUP_MEMBERSHIP
              value: {{ .Values.config.auth.ldap.requireGroupMembership | quote }}
            {{- if .Values.config.auth.ldap.existingSecret }}
            - name: LDAP_BIND_DN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.auth.ldap.existingSecret }}
                  key: {{ .Values.config.auth.ldap.bindDnKey }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.auth.ldap.existingSecret }}
                  key: {{ .Values.config.auth.ldap.bindPasswordKey }}
            {{- end }}
            {{- end }}
            # Token storage configuration
            - name: TOKEN_DB_PATH
              value: {{ .Values.persistence.mountPath }}/tokens.db
            - name: TOKEN_DB_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.tokenStorage.existingSecret | default (printf "%s-secret" (include "sbom-graph-api.fullname" .)) }}
                  key: {{ .Values.config.tokenStorage.encryptionKeyKey | default "token-db-encryption-key" }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if and .Values.config.tls.enabled .Values.config.tls.existingSecret }}
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "sbom-graph-api.fullname" . }}-data
          {{- end }}
        {{- end }}
        {{- if and .Values.config.tls.enabled .Values.config.tls.existingSecret }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.config.tls.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
