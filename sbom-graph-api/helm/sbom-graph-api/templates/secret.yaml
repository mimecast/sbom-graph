{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sbom-graph-api.fullname" . }}-secret
  labels:
    {{- include "sbom-graph-api.labels" . | nindent 4 }}
type: Opaque
data:
  # Flask secret key for sessions
  {{- if .Values.secrets.flaskSecretKey }}
  flask-secret-key: {{ .Values.secrets.flaskSecretKey | b64enc | quote }}
  {{- else }}
  flask-secret-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  # JWT secret key for token signing
  {{- if .Values.secrets.jwtSecretKey }}
  jwt-secret: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  # Token database encryption key
  {{- if .Values.secrets.tokenDbEncryptionKey }}
  token-db-encryption-key: {{ .Values.secrets.tokenDbEncryptionKey | b64enc | quote }}
  {{- else }}
  token-db-encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.falkordbPassword }}
  falkordb-password: {{ .Values.secrets.falkordbPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.ldapBindDn }}
  ldap-bind-dn: {{ .Values.secrets.ldapBindDn | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.ldapBindPassword }}
  ldap-bind-password: {{ .Values.secrets.ldapBindPassword | b64enc | quote }}
  {{- end }}
{{- else }}
# When secrets.create is false, a pre-existing secret must be provided
# via config.auth.jwt.existingSecret, config.tokenStorage.existingSecret, etc.
# This file creates a minimal secret for backwards compatibility
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sbom-graph-api.fullname" . }}-secret
  labels:
    {{- include "sbom-graph-api.labels" . | nindent 4 }}
type: Opaque
data:
  # Generate random secrets if not using existing secrets
  flask-secret-key: {{ randAlphaNum 32 | b64enc | quote }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  token-db-encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
