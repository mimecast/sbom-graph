{{/*
  Sonatype Lifecycle API credentials for release listener outbound SBOM/VEX fetches.
  - Skipped when releaseListener.sonatype.existingSecret names a pre-created Secret.
  - Skipped when a pre-created Secret already exists in the namespace (no Helm labels);
    Helm cannot adopt manually created Secrets without ownership metadata.
  - Otherwise creates/updates a Helm-managed Secret when username/password are set.
*/}}
{{- if and .Values.releaseListener.enabled (not .Values.releaseListener.sonatype.existingSecret) }}
{{- $usernameKey := .Values.releaseListener.sonatype.usernameKey | default "sonatype-username" }}
{{- $passwordKey := .Values.releaseListener.sonatype.passwordKey | default "sonatype-password" }}
{{- $secretName := include "sbom-graph.sonatype.secretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $managedBy := "" }}
{{- if $existingSecret }}
  {{- $managedBy = index ($existingSecret.metadata.labels | default dict) "app.kubernetes.io/managed-by" | default "" }}
{{- end }}
{{- $externalPreCreated := and $existingSecret (ne $managedBy "Helm") }}
{{- if not $externalPreCreated }}
{{- $username := .Values.releaseListener.sonatype.username }}
{{- $password := .Values.releaseListener.sonatype.password }}
{{- if and (not $username) $existingSecret (index $existingSecret.data $usernameKey) }}
  {{- $username = index $existingSecret.data $usernameKey | b64dec }}
{{- end }}
{{- if and (not $password) $existingSecret (index $existingSecret.data $passwordKey) }}
  {{- $password = index $existingSecret.data $passwordKey | b64dec }}
{{- end }}
{{- if and $username $password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sbom-graph.releaseListener.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $usernameKey }}: {{ $username | b64enc | quote }}
  {{ $passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
