{{- if .Values.enrichment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbom-graph.enrichment.fullname" . }}
  labels:
    {{- include "sbom-graph.enrichment.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.enrichment.replicas }}
  selector:
    matchLabels:
      {{- include "sbom-graph.enrichment.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbom-graph.enrichment.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      # Disable kubelet service-link env vars (e.g. SBOM_GRAPH_FALKORDB_SERVICE_HOST).
      # Required when TLS to FalkorDB is enabled: Celery's Redis transport validates the
      # TLS cert against the host in rediss://...; service links inject the ClusterIP,
      # which is not in the cert SAN and breaks the handshake.
      enableServiceLinks: false
      {{- if (.Values.falkordb.waitForReady | default true) }}
      initContainers:
        {{- include "sbom-graph.falkordb.waitContainer" (dict "ctx" . "tlsVolume" "tls-ca") | nindent 8 }}
      {{- end }}
      containers:
        - name: enrichment-worker
          image: "{{ .Values.enrichment.image.repository }}:{{ .Values.enrichment.image.tag }}"
          imagePullPolicy: {{ .Values.enrichment.image.pullPolicy }}
          env:
            {{- include "sbom-graph.enrichment.env" . | nindent 12 }}
          args:
            - "-A"
            - "sbom_graph_enrichment.celery_app"
            - "worker"
            - "--loglevel=info"
            - "--concurrency={{ .Values.enrichment.concurrency }}"
            - "-Q"
            - "enrichment"
          resources:
            {{- toYaml .Values.enrichment.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.falkordb.tls.enabled }}
            - name: tls-ca
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.falkordb.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ include "sbom-graph.tls.secretName" . }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
        {{- end }}
{{- end }}
