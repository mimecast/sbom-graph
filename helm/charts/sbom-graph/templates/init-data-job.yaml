{{- if .Values.initData.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sbom-graph.fullname" . }}-init-data
  labels:
    {{- include "sbom-graph.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-data
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sbom-graph.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: init-data
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      # Disable kubelet service-link env vars (e.g. SBOM_GRAPH_FALKORDB_SERVICE_HOST).
      # Required when TLS to FalkorDB is enabled: the Python redis client validates the
      # TLS cert against the host in the connection URL; service links would inject the
      # ClusterIP which is not in the cert SAN and breaks the handshake.
      enableServiceLinks: false
      {{- if (.Values.falkordb.waitForReady | default true) }}
      initContainers:
        {{- include "sbom-graph.falkordb.waitContainer" (dict "ctx" . "tlsVolume" "tls-ca") | nindent 8 }}
      {{- end }}
      containers:
        - name: populate
          image: "{{ .Values.sbomGraphApi.image.repository }}:{{ .Values.sbomGraphApi.image.tag }}"
          imagePullPolicy: {{ .Values.sbomGraphApi.image.pullPolicy }}
          command:
            - python
            - /app/scripts/populate_acme_corp.py
          env:
            - name: FALKORDB_HOST
              value: {{ include "sbom-graph.falkordb.connectHost" . | quote }}
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_GRAPH_NAME
              value: {{ .Values.graphName | quote }}
            - name: FALKORDB_SOCKET_TIMEOUT
              value: "60.0"
            - name: FALKORDB_CONNECT_TIMEOUT
              value: "30.0"
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbom-graph.falkordb.secretName" . }}
                  key: password
            {{- if .Values.falkordb.tls.enabled }}
            - name: FALKORDB_SSL
              value: "true"
            - name: FALKORDB_CA_FILE
              value: /tls/ca.crt
            - name: FALKORDB_CLIENT_CERT
              value: /tls/client.crt
            - name: FALKORDB_CLIENT_KEY
              value: /tls/client.key
            {{- end }}
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.falkordb.tls.enabled }}
            - name: tls-ca
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.falkordb.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ include "sbom-graph.tls.secretName" . }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
        {{- end }}
{{- end }}
