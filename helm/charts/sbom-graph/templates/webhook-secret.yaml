{{- if .Values.releaseListener.enabled }}
{{/*
  Webhook HMAC shared secret for sonatype-lifecycle-release-listener.
  - Uses explicit value from .Values.releaseListener.webhookSecret when provided.
  - Re-uses existing Secret on upgrade.
  - Generates a random 64-char hex secret on first install.
*/}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "sbom-graph.webhookSecret.secretName" .) }}
{{- $secret := "" }}

{{- if .Values.releaseListener.webhookSecret }}
  {{- $secret = .Values.releaseListener.webhookSecret }}
{{- else if and $existingSecret (index $existingSecret.data "webhook-secret") }}
  {{- $secret = index $existingSecret.data "webhook-secret" | b64dec }}
{{- else }}
  {{- $secret = randAlphaNum 64 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sbom-graph.webhookSecret.secretName" . }}
  labels:
    {{- include "sbom-graph.releaseListener.labels" . | nindent 4 }}
type: Opaque
data:
  webhook-secret: {{ $secret | b64enc }}
{{- end }}
