{{- if and .Values.sbomGraphApi.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sbom-graph.sbomGraphApi.fullname" . }}
  labels:
    {{- include "sbom-graph.sbomGraphApi.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.webhookPath | default "/webhook" }}
            pathType: {{ .Values.ingress.webhookPathType | default "Exact" }}
            backend:
              service:
                name: {{ include "sbom-graph.releaseListener.fullname" . }}
                port:
                  number: {{ .Values.releaseListener.service.port }}
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: {{ .Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "sbom-graph.sbomGraphApi.fullname" . }}
                port:
                  number: {{ .Values.sbomGraphApi.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
