{{- if .Values.releaseListener.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sbom-graph.releaseListener.fullname" . }}
  labels:
    {{- include "sbom-graph.releaseListener.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.releaseListener.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "sbom-graph.releaseListener.selectorLabels" . | nindent 4 }}
{{- end }}
