global:
  internalPrefixes: "group:com.acme,name:acme-"
falkordb:
  image:
    repository: falkordb/falkordb-server
    tag: v4.16.5
  password: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  tls:
    enabled: true
    # Require mutual TLS (client certificates).  When true FalkorDB
    # demands a valid client cert signed by the CA.  When false traffic
    # is still encrypted but clients connect without presenting a cert.
    requireClientAuth: true
    # When empty and tls.enabled=true, Helm generates self-signed certs.
    key: ""
    cert: ""
    caCert: ""
    clientKey: ""
    clientCert: ""
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
sbomGraphApi:
  image:
    repository: sbom-graph-api
    tag: mtls-fix
    pullPolicy: Never
  replicas: 1
  gunicornWorkers: "2"
  # Auth: enabled by default with local users (LDAP disabled)
  authEnabled: true
  ldapEnabled: false
  service:
    port: 80
    targetPort: 8080
  # Leave empty to auto-generate (persisted across upgrades via lookup).
  secrets:
    flaskSecretKey: ""
    jwtSecretKey: ""
    tokenDbEncryptionKey: ""
  tokenDb:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
releaseListener:
  image:
    repository: sonatype-lifecycle-release-listener
    tag: 0.2.0-alpha
    pullPolicy: Never
  replicas: 1
  # Leave empty to auto-generate. Retrieve after install -- see NOTES.
  webhookSecret: ""
  gunicornWorkers: "2"
  service:
    port: 80
    targetPort: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
enrichment:
  enabled: true
  image:
    repository: sbom-graph-enrichment
    tag: row-fix2
    pullPolicy: Never
  replicas: 1
  interval: "3600"
  sources: '["osv","clearlydefined"]'
  celeryBrokerDb: "1"
  celeryResultDb: "2"
  concurrency: 2
  trustScore:
    enabled: true
    interval: "7200"
    alpha: "0.4"
    decay: "0.8"
    maxDepth: "20"
    alertThreshold: "4.0"
    weights:
      securityPractices: "0.3"
      vulnerabilityProfile: "0.35"
      maintenanceHealth: "0.2"
      supplyChainHygiene: "0.15"
    ossindex:
      user: ""
      token: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  networkPolicy:
    # Enable to restrict enrichment pod egress to FalkorDB, DNS, and
    # external HTTPS (port 443) only.  Requires a CNI that supports
    # NetworkPolicy (e.g. Calico, Cilium).
    enabled: false
initData:
  enabled: true
graphName: "acme-corp"
