{{/*
  FalkorDB password Secret.
  - If .Values.falkordb.password is set explicitly, use it.
  - Otherwise, look up an existing Secret so upgrades don't regenerate.
  - If neither exists, generate a 32-character random password.
*/}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "sbom-graph.falkordb.secretName" .) }}
{{- $password := "" }}
{{- if .Values.falkordb.password }}
  {{- $password = .Values.falkordb.password }}
{{- else if and $existingSecret (index $existingSecret.data "password") }}
  {{/* Re-use the password that already exists in the cluster */}}
  {{- $password = index $existingSecret.data "password" | b64dec }}
{{- else }}
  {{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sbom-graph.falkordb.secretName" . }}
  labels:
    {{- include "sbom-graph.falkordb.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc }}
