{{- if .Values.initData.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sbom-graph.fullname" . }}-init-data
  labels:
    {{- include "sbom-graph.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-data
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sbom-graph.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: init-data
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      initContainers:
        - name: wait-for-falkordb
          image: "{{ .Values.sbomGraphApi.image.repository }}:{{ .Values.sbomGraphApi.image.tag }}"
          imagePullPolicy: {{ .Values.sbomGraphApi.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import socket, time, sys
              host, port = sys.argv[1], int(sys.argv[2])
              print(f"Waiting for {host}:{port}...")
              while True:
                  try:
                      socket.create_connection((host, port), timeout=2).close()
                      print(f"{host}:{port} is ready.")
                      break
                  except OSError:
                      print("  Not ready, retrying in 2s...")
                      time.sleep(2)
            - {{ include "sbom-graph.falkordb.fullname" . }}
            - "6379"
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      containers:
        - name: populate
          image: "{{ .Values.sbomGraphApi.image.repository }}:{{ .Values.sbomGraphApi.image.tag }}"
          imagePullPolicy: {{ .Values.sbomGraphApi.image.pullPolicy }}
          command:
            - python
            - /app/scripts/populate_acme_corp.py
          env:
            - name: FALKORDB_HOST
              value: {{ include "sbom-graph.falkordb.fullname" . | quote }}
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbom-graph.falkordb.secretName" . }}
                  key: password
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.falkordb.tls.enabled }}
            - name: tls-ca
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.falkordb.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ include "sbom-graph.tls.secretName" . }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
{{- end }}
