apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbom-graph.releaseListener.fullname" . }}
  labels:
    {{- include "sbom-graph.releaseListener.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.releaseListener.replicas }}
  selector:
    matchLabels:
      {{- include "sbom-graph.releaseListener.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbom-graph.releaseListener.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: sonatype-lifecycle-release-listener
          image: "{{ .Values.releaseListener.image.repository }}:{{ .Values.releaseListener.image.tag }}"
          imagePullPolicy: {{ .Values.releaseListener.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.releaseListener.service.targetPort }}
              protocol: TCP
          env:
            - name: FALKORDB_HOST
              value: {{ include "sbom-graph.falkordb.fullname" . | quote }}
            - name: FALKORDB_PORT
              value: "6379"
            - name: FALKORDB_GRAPH_NAME
              value: {{ .Values.graphName | quote }}
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbom-graph.falkordb.secretName" . }}
                  key: password
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbom-graph.webhookSecret.secretName" . }}
                  key: webhook-secret
            {{- if .Values.global.internalPrefixes }}
            - name: INTERNAL_PREFIXES
              value: {{ .Values.global.internalPrefixes | quote }}
            {{- end }}
            {{- if .Values.falkordb.tls.enabled }}
            - name: FALKORDB_CACERTS
              value: /tls/ca.crt
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.releaseListener.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            {{- if .Values.falkordb.tls.enabled }}
            - name: tls-ca
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        {{- if .Values.falkordb.tls.enabled }}
        - name: tls-ca
          secret:
            secretName: {{ include "sbom-graph.tls.secretName" . }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
