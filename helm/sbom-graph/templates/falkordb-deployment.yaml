apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sbom-graph.falkordb.fullname" . }}
  labels:
    {{- include "sbom-graph.falkordb.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sbom-graph.falkordb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sbom-graph.falkordb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: falkordb
          image: "{{ .Values.falkordb.image.repository }}:{{ .Values.falkordb.image.tag }}"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          {{- $args := list }}
          {{- $args = append $args "--requirepass" }}
          {{- $args = append $args "$(FALKORDB_PASSWORD)" }}
          {{- if .Values.falkordb.tls.enabled }}
          {{- $args = append $args "--tls-port" }}
          {{- $args = append $args "6379" }}
          {{- $args = append $args "--port" }}
          {{- $args = append $args "0" }}
          {{- $args = append $args "--tls-cert-file" }}
          {{- $args = append $args "/tls/tls.crt" }}
          {{- $args = append $args "--tls-key-file" }}
          {{- $args = append $args "/tls/tls.key" }}
          {{- $args = append $args "--tls-ca-cert-file" }}
          {{- $args = append $args "/tls/ca.crt" }}
          {{- end }}
          {{- if $args }}
          args:
            {{- range $args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sbom-graph.falkordb.secretName" . }}
                  key: password
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.falkordb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.falkordb.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.falkordb.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sbom-graph.falkordb.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.falkordb.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "sbom-graph.tls.secretName" . }}
        {{- end }}
