{{/*
  SBOM Graph API application secrets.
  - Uses explicit values from .Values.sbomGraphApi.secrets.* when provided.
  - Otherwise re-uses values from an existing Secret in the cluster.
  - Falls back to generating random values for first install.
*/}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "sbom-graph.sbomGraphApi.secretName" .) }}
{{- $flaskKey := "" }}
{{- $jwtKey := "" }}
{{- $dbEncKey := "" }}

{{- if .Values.sbomGraphApi.secrets.flaskSecretKey }}
  {{- $flaskKey = .Values.sbomGraphApi.secrets.flaskSecretKey }}
{{- else if and $existingSecret (index $existingSecret.data "flask-secret-key") }}
  {{- $flaskKey = index $existingSecret.data "flask-secret-key" | b64dec }}
{{- else }}
  {{- $flaskKey = randAlphaNum 48 }}
{{- end }}

{{- if .Values.sbomGraphApi.secrets.jwtSecretKey }}
  {{- $jwtKey = .Values.sbomGraphApi.secrets.jwtSecretKey }}
{{- else if and $existingSecret (index $existingSecret.data "jwt-secret-key") }}
  {{- $jwtKey = index $existingSecret.data "jwt-secret-key" | b64dec }}
{{- else }}
  {{- $jwtKey = randAlphaNum 48 }}
{{- end }}

{{- if .Values.sbomGraphApi.secrets.tokenDbEncryptionKey }}
  {{- $dbEncKey = .Values.sbomGraphApi.secrets.tokenDbEncryptionKey }}
{{- else if and $existingSecret (index $existingSecret.data "token-db-encryption-key") }}
  {{- $dbEncKey = index $existingSecret.data "token-db-encryption-key" | b64dec }}
{{- else }}
  {{- $dbEncKey = randAlphaNum 48 }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sbom-graph.sbomGraphApi.secretName" . }}
  labels:
    {{- include "sbom-graph.sbomGraphApi.labels" . | nindent 4 }}
type: Opaque
data:
  flask-secret-key: {{ $flaskKey | b64enc }}
  jwt-secret-key: {{ $jwtKey | b64enc }}
  token-db-encryption-key: {{ $dbEncKey | b64enc }}
