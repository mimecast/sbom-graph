{{- if .Values.falkordb.tls.enabled }}
{{/*
  TLS Secret for FalkorDB and client pods.
  - User-provided: uses .Values.falkordb.tls.key / .cert directly.
  - Self-signed: generates a CA + server cert via Helm crypto functions.
    Uses lookup to preserve existing certs across helm upgrade.
  The Secret always contains tls.key, tls.crt, and ca.crt.
  For user-provided certs, ca.crt equals tls.crt (assumes self-signed or
  the operator mounts a separate CA bundle).
*/}}
{{- $secretName := include "sbom-graph.tls.secretName" . }}
{{- $tlsKey := "" }}
{{- $tlsCrt := "" }}
{{- $caCrt := "" }}

{{- if include "sbom-graph.tls.isProvided" . }}
  {{/* User-provided certificates */}}
  {{- $tlsKey = .Values.falkordb.tls.key }}
  {{- $tlsCrt = .Values.falkordb.tls.cert }}
  {{- $caCrt = .Values.falkordb.tls.caCert | default .Values.falkordb.tls.cert }}
{{- else }}
  {{/* Self-signed: reuse existing Secret or generate new */}}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existingSecret (index $existingSecret.data "tls.key") }}
    {{- $tlsKey = index $existingSecret.data "tls.key" | b64dec }}
    {{- $tlsCrt = index $existingSecret.data "tls.crt" | b64dec }}
    {{- $caCrt  = index $existingSecret.data "ca.crt"  | b64dec }}
  {{- else }}
    {{- $cn := include "sbom-graph.falkordb.fullname" . }}
    {{- $svcName := printf "%s.%s.svc" $cn .Release.Namespace }}
    {{- $ca := genCA "sbom-graph-ca" 365 }}
    {{- $cert := genSignedCert $cn nil (list $cn $svcName) 365 $ca }}
    {{- $tlsKey = $cert.Key }}
    {{- $tlsCrt = $cert.Cert }}
    {{- $caCrt  = $ca.Cert }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sbom-graph.falkordb.labels" . | nindent 4 }}
type: Opaque
data:
  tls.key: {{ $tlsKey | b64enc }}
  tls.crt: {{ $tlsCrt | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
{{- end }}
