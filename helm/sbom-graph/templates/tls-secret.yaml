{{- if .Values.falkordb.tls.enabled }}
{{/*
  TLS Secret for FalkorDB and client pods.
  Contains server key/cert, CA cert, and client key/cert.
  - User-provided: uses .Values.falkordb.tls.key / .cert / .clientKey / .clientCert.
  - Self-signed: generates a CA + server cert + client cert via Helm crypto functions.
    Uses lookup to preserve existing certs across helm upgrade.
*/}}
{{- $secretName := include "sbom-graph.tls.secretName" . }}
{{- $tlsKey := "" }}
{{- $tlsCrt := "" }}
{{- $caCrt := "" }}
{{- $clientKey := "" }}
{{- $clientCrt := "" }}

{{- if include "sbom-graph.tls.isProvided" . }}
  {{/* User-provided certificates */}}
  {{- $tlsKey = .Values.falkordb.tls.key }}
  {{- $tlsCrt = .Values.falkordb.tls.cert }}
  {{- $caCrt = .Values.falkordb.tls.caCert | default .Values.falkordb.tls.cert }}
  {{- $clientKey = .Values.falkordb.tls.clientKey | default "" }}
  {{- $clientCrt = .Values.falkordb.tls.clientCert | default "" }}
{{- else }}
  {{/* Self-signed: reuse existing Secret or generate new */}}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existingSecret (index $existingSecret.data "tls.key") }}
    {{- $tlsKey = index $existingSecret.data "tls.key" | b64dec }}
    {{- $tlsCrt = index $existingSecret.data "tls.crt" | b64dec }}
    {{- $caCrt  = index $existingSecret.data "ca.crt"  | b64dec }}
    {{- if (index $existingSecret.data "client.key") }}
      {{- $clientKey = index $existingSecret.data "client.key" | b64dec }}
      {{- $clientCrt = index $existingSecret.data "client.crt" | b64dec }}
    {{- else }}
      {{/* Existing secret lacks client certs — generate them using CA from the secret.
           We cannot recover the CA private key from a stored Secret so we must regenerate
           the full set.  This path is only hit once during upgrade from an older chart
           that did not include client certs. */}}
      {{- $cn := include "sbom-graph.falkordb.fullname" . }}
      {{- $svcName := printf "%s.%s.svc" $cn .Release.Namespace }}
      {{- $ca := genCA "sbom-graph-ca" 365 }}
      {{- $serverCert := genSignedCert $cn nil (list $cn $svcName (printf "%s.%s.svc.cluster.local" $cn .Release.Namespace)) 365 $ca }}
      {{- $clientCertObj := genSignedCert "sbom-graph-client" nil nil 365 $ca }}
      {{- $tlsKey = $serverCert.Key }}
      {{- $tlsCrt = $serverCert.Cert }}
      {{- $caCrt  = $ca.Cert }}
      {{- $clientKey = $clientCertObj.Key }}
      {{- $clientCrt = $clientCertObj.Cert }}
    {{- end }}
  {{- else }}
    {{- $cn := include "sbom-graph.falkordb.fullname" . }}
    {{- $svcName := printf "%s.%s.svc" $cn .Release.Namespace }}
    {{- $ca := genCA "sbom-graph-ca" 365 }}
    {{- $serverCert := genSignedCert $cn nil (list $cn $svcName (printf "%s.%s.svc.cluster.local" $cn .Release.Namespace)) 365 $ca }}
    {{- $clientCertObj := genSignedCert "sbom-graph-client" nil nil 365 $ca }}
    {{- $tlsKey = $serverCert.Key }}
    {{- $tlsCrt = $serverCert.Cert }}
    {{- $caCrt  = $ca.Cert }}
    {{- $clientKey = $clientCertObj.Key }}
    {{- $clientCrt = $clientCertObj.Cert }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sbom-graph.falkordb.labels" . | nindent 4 }}
type: Opaque
data:
  tls.key: {{ $tlsKey | b64enc }}
  tls.crt: {{ $tlsCrt | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
  client.key: {{ $clientKey | b64enc }}
  client.crt: {{ $clientCrt | b64enc }}
{{- end }}
