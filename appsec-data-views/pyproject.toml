[project]
name = "appsec-data-views"
version = "0.1.3"
description = "AppSec Data Views - Flask application for FalkorDB graph data visualizations"
authors = [
    {name = "Brett Crawley"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.1",
    "flask-wtf>=1.2.0",
    "flask-login>=0.6.0",
    "gunicorn>=23.0.0",
    "falkordb>=1.0.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "ldap3>=2.9.0",
    "cryptography>=46.0.5",
    "sqlalchemy>=2.0.0",
    "werkzeug>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "bandit[toml]>=1.7.0",
]

[project.scripts]
appsec-data-views = "appsec_data_views.app:main"

[tool.uv]

[tool.uv.sources]
# Local development dependencies can be added here if needed

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = []
# Security levels: low, medium, high
# Confidence levels: low, medium, high

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appsec_data_views"]

[tool.hatch.build.targets.sdist]
exclude = [".coveragerc", "tests/**", "coverage-reports/**", "AGENTS.md", "renovate.json", "inventory.yaml", "Jenkinsfile", "sonar-project.properties"]
