<!DOCTYPE html>
<html>
<head>
    <title>Change Password - AppSec Data Views</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; max-width: 450px;
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h1 { color: #366092; margin: 0; font-size: 24px; border-bottom: none; }
        .form-group input { font-size: 16px; }
        .info-message {
            background: #e3f2fd; color: #1565c0; padding: 12px 15px;
            border-radius: 6px; margin-bottom: 20px; font-size: 14px;
        }
        .submit-btn {
            width: 100%; padding: 14px; background: #366092; color: white;
            border: none; border-radius: 6px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: background 0.3s;
        }
        .submit-btn:hover { background: #254a73; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Change Your Password</h1>
        </div>

        <div class="info-message">
            You must change your temporary password before continuing.
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required
                       placeholder="Enter your temporary password">
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required
                       placeholder="Enter your new password" minlength="8">
                <div class="password-requirements">Minimum 8 characters</div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       placeholder="Confirm your new password">
            </div>

            <button type="submit" class="submit-btn">Change Password</button>
        </form>
    </div>
</body>
</html>
