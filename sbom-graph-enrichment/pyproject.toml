[project]
name = "sbom-graph-enrichment"
version = "0.2.0-alpha"
description = "Celery-based enrichment pipeline for sbom-graph"
authors = [
    {name = "Brett Crawley"}
]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "sbom-graph-model",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "respx>=0.22.0",
    "celery-types>=0.22.0",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
]

[tool.uv.sources]
sbom-graph-model = { path = "../sbom-graph-model", editable = true }


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sbom_graph_enrichment"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/**"]
